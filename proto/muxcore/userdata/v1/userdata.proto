syntax = "proto3";

package muxcore.userdata.v1;

option go_package = "github.com/Muxcore-Media/userdata-local/proto/gen/muxcore/userdata/v1;userdatav1";

// UserDataService persists per-user household library state (progress, favorites, prefs).
// JSON blob shape matches media-ui-app / muxcore-ios UserdataBlob (see README).
service UserDataService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc ListContinueWatching(ListContinueWatchingRequest) returns (ListContinueWatchingResponse);
}

message GetRequest {
  string user_id = 1;
}

message GetResponse {
  bytes json = 1;
  int64 revision = 2;
}

message PutRequest {
  string user_id = 1;
  bytes json = 2;
}

message PutResponse {
  bytes json = 1;
  int64 revision = 2;
}

message ListContinueWatchingRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ListContinueWatchingResponse {
  bytes json = 1;
}
